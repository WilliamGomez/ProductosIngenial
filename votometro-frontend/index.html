<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>Ingenial IA · Votometro</title>

    <!--
      Fuente Inter desde Google Fonts.
      · preconnect a fonts.googleapis.com + fonts.gstatic.com (TLS handshake
        en paralelo con el HTML parse → primer render más rápido).
      · display=swap → el browser usa la fuente fallback hasta que Inter
        descarga, y luego intercambia. Evita FOIT (flash of invisible text).
      · weights 400/500/600/700 — los necesarios para body / medium / semibold
        / bold; nada más para mantener el payload pequeño (~28KB cada peso).
      · La CSP del nginx YA permite font-src 'self' data: y connect-src 'self';
        Google Fonts CSS llega vía link, así que necesita style-src y font-src
        de googleapis/gstatic. Si activamos esa CSP, ajustar nginx.conf.
        Por ahora se sirve sin CSP fuerte en dev.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
