# =============================================================================
# Votometro · Frontend nginx config (hardened, non-root)
# -----------------------------------------------------------------------------
# Aplica las siguientes mitigaciones OWASP:
#   - Information disclosure: `server_tokens off` oculta la versión.
#   - Clickjacking: `X-Frame-Options: DENY`.
#   - MIME sniffing: `X-Content-Type-Options: nosniff`.
#   - Cross-site-scripting: `Content-Security-Policy` restrictiva (ver §CSP).
#   - HSTS: solo se emite si el tráfico pasa por TLS (detectado via $https o
#     X-Forwarded-Proto desde el reverse proxy upstream en producción).
#   - Referrer-Policy: `no-referrer` para no filtrar URLs internas.
#   - Permissions-Policy: deshabilita APIs sensibles del navegador.
#
# Notas:
#   * El contenedor escucha en 8080 (puerto >1024) para correr como non-root.
#   * La imagen nginxinc/nginx-unprivileged ya elimina el bloque `user`
#     global de /etc/nginx/nginx.conf; esta config se incluye como
#     `/etc/nginx/conf.d/default.conf`.
#
# ### CSP
# La Content-Security-Policy actual permite lo necesario para:
#   - MSAL (login.microsoftonline.com)
#   - Power BI Embedded (app.powerbi.com + CDN)
#   - La API local / producción (configurada via template)
# Revisar si se agregan nuevos orígenes (CDN de fonts, Application Insights).
# =============================================================================

map "$http_x_azure_fdid:${REQUIRE_FRONTDOOR}" $block_direct_origin {
    default 0;
    "~^:true$" 1;
    "~^.+:true$" 1;
    "${FRONTDOOR_ID}:true" 0;
}

server {
    listen       8080 default_server;
    listen       [::]:8080 default_server;
    server_name  _;

    # ------------------------------------------------------------------ #
    #  Servido estático + fallback SPA
    # ------------------------------------------------------------------ #
    root   /usr/share/nginx/html;
    index  index.html;

    # ------------------------------------------------------------------ #
    #  Hardening HTTP
    # ------------------------------------------------------------------ #
    server_tokens off;                                           # no "nginx/1.x"

    # NOTA (refactor para soportar reverse-proxy /api):
    #   El método-guard `if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { 405 }`
    #   estaba en el server block y se ejecutaba para TODAS las requests,
    #   incluyendo POST/PUT/DELETE hacia `/api/...`. nginx procesa los `if`
    #   server-level antes de matchear locations, así que cualquier request
    #   no-GET/HEAD/OPTIONS quedaba muerta antes del `proxy_pass`. Se movió
    #   a las locations que sirven contenido estático (donde sí queremos
    #   rechazar métodos de escritura). El `location /api/` no aplica este
    #   guard — los métodos válidos los decide Azure Functions.

    # Tamaño máximo del body. Subido a 5m para dar margen a payloads JSON
    # de `/api/*` (login, force-logout, etc.); el SPA en sí no recibe uploads.
    client_max_body_size 5m;
    client_body_buffer_size 16k;
    large_client_header_buffers 4 8k;

    # ------------------------------------------------------------------ #
    #  Cabeceras de seguridad
    # ------------------------------------------------------------------ #
    add_header X-Frame-Options            "DENY"                                  always;
    add_header X-Content-Type-Options     "nosniff"                               always;
    add_header Referrer-Policy            "no-referrer"                           always;

    # Cross-Origin-Opener-Policy:
    #   Antes: "same-origin" → bloquea `window.closed`/`postMessage` entre el
    #     padre y los popups de otro origen. Eso rompía MSAL: `loginPopup()`
    #     y `acquireTokenPopup()` abren ventanas a `login.microsoftonline.com`
    #     y necesitan que el padre pueda leer `popup.closed` para resolver la
    #     promesa. El síntoma era: spinner infinito + en consola
    #     "COOP policy would block the window.closed call".
    #   Ahora: "same-origin-allow-popups" → mantiene el aislamiento del
    #     contexto principal pero permite la comunicación con popups que
    #     el propio sitio abre (caso MSAL). Es la recomendación oficial de
    #     Microsoft Identity Web cuando se usa popup flow.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups"            always;

    # Cross-Origin-Resource-Policy: aplica a sub-recursos (imágenes, scripts,
    # fuentes), NO a la comunicación entre ventanas → no afecta a MSAL.
    add_header Cross-Origin-Resource-Policy "same-site"                           always;
    add_header X-Permitted-Cross-Domain-Policies "none"                           always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(), payment=()" always;

    # HSTS: 2 años, incluyendo subdominios. Solo tiene efecto sobre HTTPS;
    # el navegador lo ignora sobre HTTP, así que es seguro enviarlo siempre.
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;

    # CSP: endurecida — ajusta aquí si se agregan nuevos orígenes.
    # NOTA: 'unsafe-inline' en styles es requerido por Tailwind runtime.
    #       Evitamos 'unsafe-eval' y 'unsafe-inline' en scripts.
    # Fuente Inter via Google Fonts → necesita allowlistear:
    #   · style-src  fonts.googleapis.com (el CSS @font-face)
    #   · font-src   fonts.gstatic.com    (los .woff2 reales)
    # Si en el futuro se self-hostea Inter (vía @fontsource/inter), retirar
    # estas dos entries para volver a la CSP minimal.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://alcdn.msauth.net https://*.powerbi.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.powerbi.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com https://*.powerbi.com https://api.powerbi.com; frame-src 'self' https://app.powerbi.com https://*.powerbi.com https://login.microsoftonline.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; manifest-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; upgrade-insecure-requests" always;

    # ------------------------------------------------------------------ #
    #  Cache policy por tipo de asset
    # ------------------------------------------------------------------ #
    # Assets versionados (hash Vite) → cache inmutable 1 año.
    location = /origin-health {
        access_log off;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    location ~* \.(?:css|js|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        if ($block_direct_origin) { return 404; }
        # Method guard local — sólo lectura para assets estáticos.
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # Re-aplicar los headers de seguridad (add_header no hereda cuando
        # la location agrega los suyos).
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html SIEMPRE sin cache para que el usuario reciba el último bundle.
    location = /index.html {
        if ($block_direct_origin) { return 404; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /index.html =404;
    }

    # ------------------------------------------------------------------ #
    #  Reverse proxy /api/* → API (Azure Functions)
    # ------------------------------------------------------------------ #
    # Same-origin trick: el SPA pega a /api/... (relativo al frontend)
    # y nginx lo reenvía al Azure Container App interno configurado en
    # API_UPSTREAM. En UAT el default de la imagen apunta a:
    # https://ca-votometro-api-uat.internal.whitesea-d6c244aa.eastus2.azurecontainerapps.io
    # Beneficios:
    #
    #   1. Sin CORS preflight: browser ve mismo origen → no envía OPTIONS.
    #      Antes: POST /api/session disparaba un OPTIONS preflight a
    #      localhost:7071, Azure Functions devolvía 404 (no había handler
    #      OPTIONS), browser bloqueaba la request → "Network Error".
    #   2. Replica la arquitectura de prod (front + API detrás del mismo
    #      dominio vía API Management/Front Door).
    #   3. No expone localhost:7071 al browser (sólo 8080).
    #
    # NOTA: no usar aliases de Docker Compose en Azure
    # Container Apps. Ese alias solo existe en redes bridge locales.
    location /api/ {
        if ($block_direct_origin) { return 404; }
        # Sin URI en proxy_pass: nginx preserva el path original completo
        # (/api/health, /api/user, etc.). Azure Functions expone las rutas
        # reales bajo /api; si agregamos /api/ aquí, nginx reescribe el path.
        proxy_pass ${API_UPSTREAM};

        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Host              $proxy_host;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $http_connection;
        proxy_redirect off;

        # Timeouts realistas — Functions cold-start puede tardar varios
        # segundos. 90s alinea con el `timeout: 60000` de axios + margen.
        proxy_connect_timeout 10s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;

        # Buffering off: respuestas son JSON pequeño, no merece buffer.
        proxy_buffering off;
    }

    # SPA fallback: cualquier ruta no encontrada → index.html (React Router).
    location / {
        if ($block_direct_origin) { return 404; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri $uri/ /index.html;
    }

    # Bloquear acceso a dotfiles (/.git, /.env, /.DS_Store, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Oculta páginas de error estándar (que delatan tecnología).
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
